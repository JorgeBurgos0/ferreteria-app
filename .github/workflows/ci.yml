name: Verificación

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - name: Dependencias de npm
        run: npm ci
      - name: Pruebas web
        run: npm test
      - name: Compilación web
        run: npm run build
      - name: Comprobación Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Pruebas Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
